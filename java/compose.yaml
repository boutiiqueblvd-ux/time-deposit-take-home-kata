services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: time_deposits
      POSTGRES_USER: time_deposits
      POSTGRES_PASSWORD: time_deposits
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U time_deposits -d time_deposits"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/time_deposits
    ports:
      - "8080:8080"
